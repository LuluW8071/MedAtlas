name: medatlas

services:
  redis:
    image: redis:7-alpine

    ports:
      - "127.0.0.1:6380:6379"

    volumes:
      - redis_data:/data

    command:
      - redis-server
      - --appendonly
      - "yes"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

    restart: unless-stopped

volumes:
  redis_data:
