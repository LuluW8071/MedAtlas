name: test

on:
  push:
    branches: [main, dev]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    # mongo:8 refuses to start on kernels >= 6.19 (SERVER-121912); the older image has an older kernel.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports: ["6333:6333"]
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/?serverSelectionTimeoutMS=5000
      REDIS_URL: redis://127.0.0.1:6379
      QDRANT_URL: http://127.0.0.1:6333
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-
      - run: bun install --frozen-lockfile
      - run: bunx tsx --test tests/*.test.ts
        working-directory: server
      - if: failure()
        run: docker ps -a && docker logs $(docker ps -aq --filter ancestor=mongo:8) 2>&1 | tail -40
